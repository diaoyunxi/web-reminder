<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UI Change Detector</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      font-size: 14px;
      color: #333;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .container {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      color: #667eea;
      margin-bottom: 15px;
      text-align: center;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      padding: 10px;
      background: #f8f9fa;
      border-radius: 8px;
    }

    .status-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 8px;
      animation: pulse 2s infinite;
    }

    .status-indicator.active {
      background: #4caf50;
    }

    .status-indicator.inactive {
      background: #f44336;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .setting-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .setting-item:last-child {
      border-bottom: none;
    }

    .setting-label {
      font-weight: 500;
      color: #555;
    }

    .toggle-switch {
      position: relative;
      width: 50px;
      height: 26px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.3s;
      border-radius: 26px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #667eea;
    }

    input:checked + .slider:before {
      transform: translateX(24px);
    }

    .stats {
      margin-top: 15px;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 8px;
    }

    .stats-title {
      font-weight: 600;
      color: #667eea;
      margin-bottom: 10px;
      font-size: 13px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 12px;
    }

    .stat-value {
      font-weight: 600;
      color: #333;
    }

    .footer {
      margin-top: 15px;
      text-align: center;
      font-size: 11px;
      color: #999;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #5568d3;
    }

    button.secondary {
      background: #f0f0f0;
      color: #666;
    }

    button.secondary:hover {
      background: #e0e0e0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 UI Change Detector</h1>
    
    <div class="status">
      <div class="status-indicator active" id="statusIndicator"></div>
      <span id="statusText">Monitoring Active</span>
    </div>

    <div class="setting-item">
      <span class="setting-label">Enable Notifications</span>
      <label class="toggle-switch">
        <input type="checkbox" id="enableNotifications" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="setting-item">
      <span class="setting-label">Sound</span>
      <label class="toggle-switch">
        <input type="checkbox" id="enableSound" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="setting-item">
      <span class="setting-label">Require Interaction</span>
      <label class="toggle-switch">
        <input type="checkbox" id="requireInteraction">
        <span class="slider"></span>
      </label>
    </div>

    <div class="stats">
      <div class="stats-title">📊 Statistics</div>
      <div class="stat-row">
        <span>Changes Detected:</span>
        <span class="stat-value" id="changesCount">0</span>
      </div>
      <div class="stat-row">
        <span>Last Change:</span>
        <span class="stat-value" id="lastChange">-</span>
      </div>
    </div>

    <button id="testNotificationBtn">Test Notification</button>
    <button class="secondary" id="resetStatsBtn">Reset Statistics</button>

    <div class="footer">
      v1.0.0 • Monitoring all tabs
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
