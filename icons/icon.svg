<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- Eye/monitoring icon -->
  <g fill="white">
    <!-- Eye outline -->
    <path d="M64 38 C45 38, 28 50, 20 64 C28 78, 45 90, 64 90 C83 90, 100 78, 108 64 C100 50, 83 38, 64 38 Z M64 82 C50 82, 37 74, 30 64 C37 54, 50 46, 64 46 C78 46, 91 54, 98 64 C91 74, 78 82, 64 82 Z" fill="white"/>
    
    <!-- Pupil -->
    <circle cx="64" cy="64" r="12" fill="white"/>
    <circle cx="64" cy="64" r="6" fill="#667eea"/>
  </g>
  
  <!-- Change indicator arrows -->
  <g transform="translate(64, 64)">
    <path d="M-8,-20 L0,-28 L8,-20" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <path d="M8,20 L0,28 L-8,20" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  </g>
</svg>
